name: Test Mobile Local Co-op

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mobile-overrides/mobile-coop-integrity.js'
      - 'mobile-overrides/mobile-coop-worldmodes-fix.js'
      - 'mobile-overrides/controller-nav2.js'
      - 'mobile-overrides/controller-pause-owner.js'
      - 'mobile-overrides/controller-nav.css'
      - 'mobile-overrides/tutorial.js'
      - 'mobile-overrides/tutorial.css'
      - 'mobile-overrides/tutorial-sandbox.js'
      - 'mobile-overrides/guided-tour.js'
      - 'mobile-overrides/guided-tour.css'
      - 'mobile-overrides/guided-tour-mobile-guard.js'
      - 'mobile-overrides/mobile-tutorial-shame-achievement.js'
      - 'mobile-overrides/mobile-fun-easter-eggs.js'
      - 'mobile-overrides/mobile-lighting-shader.js'
      - 'mobile-overrides/mobile-lighting-shader.css'
      - 'mobile-overrides/mobile-combat-performance-fix.js'
      - 'mobile-overrides/mobile-custom-audio.js'
      - 'mobile-overrides/mobile-custom-audio.css'
      - 'mobile-overrides/mobile-custom-audio-import.css'
      - 'scripts/apply-mobile-patches.js'
      - 'scripts/apply-mobile-patches-core.js'
      - 'tests/coop-runtime.spec.cjs'
      - 'tests/coop-runtime-v2.spec.cjs'
      - 'tests/controller-tutorial.spec.cjs'
      - 'tests/custom-audio.spec.cjs'
      - 'tests/tutorial-shame-achievement.spec.cjs'
      - 'tests/fun-easter-eggs.spec.cjs'
      - 'tests/lighting-shader.spec.cjs'
      - 'tests/combat-performance-fix.spec.cjs'
      - '.github/workflows/test-coop.yml'

permissions:
  contents: read

jobs:
  coop-mobile-browser:
    name: Mobile local co-op runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Baixar repositório Mobile
        uses: actions/checkout@v4
        with:
          path: mobile
      - name: Baixar base Web fixada da build Mobile
        uses: actions/checkout@v4
        with:
          repository: V-prof1/Survive-Chaos
          ref: 17adf0a8c3422200fcd6021d39a14689b35ae2b2
          path: browser
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Montar runtime Mobile
        shell: bash
        run: |
          rm -rf mobile/www
          cp -a browser/www mobile/www
          cd mobile
          node scripts/apply-mobile-patches.js
          node --check www/mobile-coop-integrity.js
          node --check www/mobile-coop-worldmodes-fix.js
          node --check www/controller-nav2.js
          node --check www/controller-pause-owner.js
          node --check www/tutorial.js
          node --check www/tutorial-sandbox.js
          node --check www/guided-tour.js
          node --check www/guided-tour-mobile-guard.js
          node --check www/mobile-tutorial-shame-achievement.js
          node --check www/mobile-fun-easter-eggs.js
          node --check www/mobile-lighting-shader.js
          node --check www/mobile-combat-performance-fix.js
          node --check www/mobile-custom-audio.js
          node --check tests/coop-runtime.spec.cjs
          node --check tests/coop-runtime-v2.spec.cjs
          node --check tests/controller-tutorial.spec.cjs
          node --check tests/custom-audio.spec.cjs
          node --check tests/tutorial-shame-achievement.spec.cjs
          node --check tests/fun-easter-eggs.spec.cjs
          node --check tests/lighting-shader.spec.cjs
          node --check tests/combat-performance-fix.spec.cjs
          grep -q 'mobile-coop-integrity.js' www/index.html
          grep -q 'mobile-coop-worldmodes-fix.js' www/index.html
          grep -q 'controller-nav2.js' www/index.html
          grep -q 'controller-pause-owner.js' www/index.html
          grep -q 'tutorial.js' www/index.html
          grep -q 'tutorial-sandbox.js' www/index.html
          grep -q 'guided-tour.js' www/index.html
          grep -q 'guided-tour-mobile-guard.js' www/index.html
          grep -q 'mobile-tutorial-shame-achievement.js' www/index.html
          grep -q 'mobile-fun-easter-eggs.js' www/index.html
          grep -q 'mobile-lighting-shader.js' www/index.html
          grep -q 'mobile-lighting-shader.css' www/index.html
          grep -q 'mobile-combat-performance-fix.js' www/index.html
          grep -q 'mobile-custom-audio.js' www/index.html
          grep -q 'mobile-custom-audio-import.css' www/index.html
      - name: Instalar navegador de teste
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Testar co-op local no runtime Mobile
        working-directory: mobile
        run: node tests/coop-runtime-v2.spec.cjs www
      - name: Testar tutorial e navegação por controle no Mobile
        working-directory: mobile
        run: node tests/controller-tutorial.spec.cjs www
      - name: Testar áudio personalizado no Mobile
        if: always()
        working-directory: mobile
        run: node tests/custom-audio.spec.cjs www
      - name: Testar conquista secreta de morte no tutorial
        if: always()
        working-directory: mobile
        run: node tests/tutorial-shame-achievement.spec.cjs www
      - name: Testar easter eggs raros e engraçados
        if: always()
        working-directory: mobile
        run: node tests/fun-easter-eggs.spec.cjs www
      - name: Testar iluminação híbrida adaptativa
        if: always()
        working-directory: mobile
        run: node tests/lighting-shader.spec.cjs www
      - name: Testar ataques de Boss, imortalidade e otimização
        if: always()
        working-directory: mobile
        run: node tests/combat-performance-fix.spec.cjs www
